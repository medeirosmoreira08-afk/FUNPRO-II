<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questão 9 - Três formas de tratar eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. Botão A: atributo HTML onclick -->
  <button id="btn-a" onclick="mostraData()">Botão A (atributo HTML)</button>

  <!-- 2. Botão B: propriedade .onclick no JS -->
  <button id="btn-b">Botão B (propriedade JS)</button>

  <!-- 3. Botão C: addEventListener no JS -->
  <button id="btn-c">Botão C (addEventListener)</button>

  <p id="data"></p>

  <script src="script.js"></script>
</body>
</html>
